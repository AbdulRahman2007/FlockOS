name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pouktry_test
          POSTGRES_USER: pouktry
          POSTGRES_PASSWORD: pouktry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pouktry -d pouktry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pouktry:pouktry_test@localhost:5432/pouktry_test
      TEST_DATABASE_URL: postgresql+psycopg://pouktry:pouktry_test@localhost:5432/pouktry_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e 'backend[dev]'
      - run: ruff check backend
      - run: ruff format --check backend
      - run: mypy app
        working-directory: backend
      - run: alembic -c backend/alembic.ini upgrade head
      - run: pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install chrome
      - run: npm run e2e
